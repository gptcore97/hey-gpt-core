<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>GPT CORE</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#5b9bff"/><stop offset=".5" stop-color="#a77bf0"/><stop offset="1" stop-color="#f07a8f"/></linearGradient>
</defs></svg>

<div id="app">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <button class="ib" id="btnMenu" aria-label="Menu"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h10M4 17h16"/></svg></button>
    <button class="pill" id="modelPill" aria-label="Scegli API"><i class="live"></i><span id="pillText">Nessuna API</span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></button>
    <button class="avatar" id="btnAvatar" aria-label="Impostazioni"><div id="avatarL">F</div></button>
  </header>

  <main id="main">
    <div id="hero">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gg)"/></svg></div>
      <h1><span id="greet">Ciao</span>,<br><b class="grad-t" id="heroName">Flubatir</b></h1>
      <p>Come posso aiutarti oggi?</p>
    </div>
    <div id="chat" class="hidden"></div>
    <div id="sugg">
      <div class="cap">Suggerimenti</div>
      <div class="sg">
        <button class="sc" data-p="Scrivi e analizza del codice in Python per ordinare una lista"><i style="--c:#5b9bff"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg></i><p>Scrivi o analizza codice</p></button>
        <button class="sc" data-p="Dammi 5 idee creative per un progetto tecnologico originale"><i style="--c:#a77bf0"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 2.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"/></svg></i><p>Idee e brainstorming</p></button>
        <button class="sc" data-p="Riepiloga in 3 punti i concetti chiave della fisica quantistica"><i style="--c:#f07a8f"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg></i><p>Riepiloga o traduci</p></button>
        <button class="sc" data-p="Quali sono gli ultimi aggiornamenti per ottimizzare un PC da gaming?"><i style="--c:#34d399"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25A2.25 2.25 0 015.25 3h13.5A2.25 2.25 0 0121 5.25z"/></svg></i><p>Tech e gaming</p></button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div id="chips"></div>
    <div class="bar">
      <button class="rb" id="btnPlus" aria-label="Allega"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Chiedi a GPT CORE..." autocomplete="off" autocapitalize="sentences"></textarea>
      <div class="acts">
        <button class="ab2" id="btnMic" aria-label="Dettatura"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 003-3V4.5a3 3 0 10-6 0v8.25a3 3 0 003 3z"/></svg></button>
        <button class="assist" id="btnAssist" aria-label="Assistente vocale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 10v4M9 6.5v11M13 3.5v17M17 7.5v9M21 10.5v3"/></svg></button>
        <button class="send hidden" id="btnSend" aria-label="Invia"></button>
      </div>
    </div>
    <div class="disc">GPT CORE può mostrare informazioni non accurate.</div>
  </footer>

  <!-- menu modelli -->
  <div id="modelMenu" class="ov hidden"><div class="mm" id="mmCard"></div></div>

  <!-- allegati -->
  <div id="attach" class="ov dim hidden"><div class="sheet"><div class="grip"></div><h3>Aggiungi contenuto</h3>
    <div class="g3"><button data-k="gal"><span><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.16-5.16a2.25 2.25 0 013.18 0l5.16 5.16m-1.5-1.5l1.41-1.41a2.25 2.25 0 013.18 0l2.41 2.41M3.75 21h16.5a1.5 1.5 0 001.5-1.5V4.5a1.5 1.5 0 00-1.5-1.5H3.75a1.5 1.5 0 00-1.5 1.5v15a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V9.75z"/></svg></span>Galleria</button><button data-k="cam"><span><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0c-.684.039-1.314.42-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/></svg></span>Fotocamera</button><button data-k="doc"><span><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg></span>Documenti</button></div>
  </div></div>

  <!-- menu laterale -->
  <div id="drawer" class="ov"><div class="dp">
    <div class="dh"><div class="dlogo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gg)"/></svg><b class="grad-t">GPT CORE</b></div><button class="ib" id="dClose" style="padding:8px" aria-label="Chiudi"><svg style="width:20px;height:20px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <button class="nb" id="dNew"><svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg><span>Nuova chat</span></button>
    <div class="dsec">Strumenti</div>
    <button class="di" id="dAssist"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M5 10v4M9 6.5v11M13 3.5v17M17 7.5v9M21 10.5v3"/></svg><span class="l">Assistente vocale</span></button>
    <button class="di" id="dVoice"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg><span class="l">Conversazione vocale</span></button>
    <button class="di" id="dStore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z"/></svg><span class="l">Store API e modelli</span></button>
    <button class="di" id="dMail"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg><span class="l">Contatta il creatore</span></button>
    <div class="dsec">Recenti</div>
    <div id="recents"></div>
    <div class="dfoot"><button class="di" id="dSet"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span class="l">Impostazioni</span></button></div>
  </div></div>

  <!-- schermate -->
  <section id="scrStore" class="screen"><div class="sh"><button class="ib" data-back="store"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2 id="storeTitle">Store API</h2></div><div class="sb" id="storeBody"></div></section>
  <section id="scrMail" class="screen"><div class="sh"><button class="ib" data-back="mail"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2>Mail</h2><div class="tabs"><button id="tabW" class="on">Scrivi</button><button id="tabH">Storico</button></div></div><div class="sb" id="mailBody"></div></section>
  <section id="scrSet" class="screen"><div class="sh"><button class="ib" data-back="set"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2>Impostazioni</h2></div><div class="sb" id="setBody"></div></section>

  <!-- conversazione vocale -->
  <div id="voice" class="voice hidden" data-s="idle">
    <button class="ib vclose" id="vClose" aria-label="Chiudi conversazione vocale"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    <div class="vmid"><div class="orbwrap"><i class="ring r1"></i><i class="ring r2"></i><button class="orb" id="vOrb" aria-label="Tocca per inviare o interrompere"></button></div><div id="vState"></div><div id="vTxt"></div></div>
    <div class="vhint">Tocca la sfera per inviare subito o interrompere la risposta</div>
  </div>

  <div id="auth" class="auth hidden"></div>

  <div id="dlg" class="ov dim hidden"><div class="dlgc"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="btns"><button class="btn" id="dlgNo">Annulla</button><button class="btn pri" id="dlgYes">OK</button></div></div></div>
  <div id="toast"></div>
</div>

<input type="file" id="fGal" accept="image/*" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fDoc" accept=".txt,.md,.py,.js,.ts,.json,.csv,.html,.css,.xml,.yml,.yaml,.ini,.log,.c,.cpp,.h,.java,.sh,.bat,text/*" multiple hidden>
<input type="file" id="fCfg" accept=".json,application/json" hidden>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
